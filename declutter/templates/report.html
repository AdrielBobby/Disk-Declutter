<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Declutter Report</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#667085; --line:#e4e7ec;
    --accent:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626; --bar:#93b4f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1318; --card:#181d24; --text:#e6e9ee; --muted:#8b94a3; --line:#2a313b;
            --accent:#6b9bff; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --bar:#3b5ea8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { padding:20px 24px 0; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); }
  .cards { display:flex; gap:12px; flex-wrap:wrap; padding:16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:150px; }
  .card b { display:block; font-size:20px; }
  .tabs { display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab { background:none; border:0; padding:10px 14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font:inherit; }
  .tab.on { color:var(--text); border-color:var(--accent); font-weight:600; }
  .tools { display:flex; gap:12px; align-items:center; padding:14px 24px; flex-wrap:wrap; }
  input[type=search] { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-width:240px; font:inherit; }
  select, button.act { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  button.act { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  main { padding:0 24px 90px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .path { color:var(--muted); font-size:12px; word-break:break-all; }
  .reason { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .low { color:var(--good); } .medium { color:var(--warn); } .high { color:var(--bad); }
  .ai { font-size:12px; color:var(--accent); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .bar-row { display:grid; grid-template-columns:260px 1fr 90px; gap:10px; align-items:center; padding:6px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
  .bar-row.click { cursor:pointer; }
  .bar-row.click:hover { border-color:var(--accent); }
  .bar { height:14px; background:var(--bar); border-radius:4px; }
  .crumbs { margin:6px 0 12px; }
  .crumbs a { color:var(--accent); cursor:pointer; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 24px; display:flex; gap:16px; align-items:center; }
  footer .grow { flex:1; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Disk Declutter</h1>
  <div class="sub" id="scanned"></div>
</header>
<div class="cards" id="cards"></div>
<div class="tabs" id="tabs"></div>
<div class="tools" id="tools">
  <input type="search" id="q" placeholder="Filter by name or path">
  <label>Min confidence
    <select id="conf">
      <option value="0">any</option><option value="0.3">30%+</option>
      <option value="0.5">50%+</option><option value="0.7">70%+</option><option value="0.85">85%+</option>
    </select>
  </label>
  <button class="act" id="selhigh">Select all 70%+ confident, low risk</button>
  <button class="act" id="clearsel">Clear selection</button>
</div>
<main id="main"></main>
<footer>
  <div><b id="selcount">0</b> selected, <b id="seltotal">0 B</b></div>
  <div class="hint grow" id="hint">Nothing is deleted from this page. Export your selection, then run <code>python -m declutter clean</code>.</div>
  <button class="act primary" id="export" disabled>Export selection.json</button>
</footer>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const items = DATA.items.map((it, i) => Object.assign({id: i}, it));
const KINDS = {all:'All', file:'Old files', duplicate:'Duplicates', cache:'Caches', app:'Apps', usage:'Disk usage'};
const state = {tab:'all', sort:'size_bytes', dir:-1, q:'', conf:0, sel:new Set(), usagePath:[]};

const fmt = b => { const u=['B','KB','MB','GB','TB']; let i=0; while (b>=1024 && i<4) { b/=1024; i++; } return (i>1?b.toFixed(2):Math.round(b))+' '+u[i]; };
const ago = ts => { if (!ts) return 'unknown'; const d=Math.floor((Date.now()/1000-ts)/86400); return d<1?'today':d+' days ago'; };
const el = (tag, props={}, ...kids) => { const e=document.createElement(tag); Object.assign(e, props); kids.flat().forEach(k => e.append(k)); return e; };

function visible() {
  const q = state.q.toLowerCase();
  return items.filter(i => (state.tab==='all' || i.kind===state.tab) && i.confidence>=state.conf &&
    (!q || i.name.toLowerCase().includes(q) || i.path.toLowerCase().includes(q)))
    .sort((a,b) => (a[state.sort] > b[state.sort] ? 1 : a[state.sort] < b[state.sort] ? -1 : 0) * state.dir);
}

function renderCards() {
  const box = document.getElementById('cards'); box.replaceChildren();
  const sum = f => items.filter(f).reduce((s,i)=>s+i.size_bytes,0);
  const cards = [
    ['Reclaimable (files, caches)', fmt(sum(i=>i.deletable && i.kind!=='app'))],
    ['High confidence (70%+)', fmt(sum(i=>i.deletable && i.confidence>=0.7))],
    ['Apps found', items.filter(i=>i.kind==='app').length + ' (' + fmt(sum(i=>i.kind==='app')) + ')'],
    ['Profile size', DATA.usage_tree ? fmt(DATA.usage_tree.size) : 'n/a'],
  ];
  cards.forEach(([l,v]) => box.append(el('div',{className:'card'}, el('span',{className:'sub',textContent:l}), el('b',{textContent:v}))));
}

function renderTabs() {
  const box = document.getElementById('tabs'); box.replaceChildren();
  Object.entries(KINDS).forEach(([k,label]) => {
    if (k==='usage' && !DATA.usage_tree) return;
    const n = k==='all' ? items.length : k==='usage' ? '' : items.filter(i=>i.kind===k).length;
    const b = el('button',{className:'tab'+(state.tab===k?' on':''), textContent: label + (n!==''?' ('+n+')':'')});
    b.onclick = () => { state.tab=k; render(); };
    box.append(b);
  });
}

function renderTable(main) {
  const rows = visible();
  if (!rows.length) { main.append(el('div',{className:'empty',textContent:'Nothing matches the current filters.'})); return; }
  const cols = [['', null], ['Item','name'], ['Size','size_bytes','num'], ['Last used','last_used','num'], ['Confidence','confidence','num'], ['Risk','risk']];
  const head = el('tr');
  cols.forEach(([label,key,cls]) => {
    const th = el('th',{textContent: label + (key===state.sort ? (state.dir<0?' ▾':' ▴') : ''), className:cls||''});
    if (key) th.onclick = () => { state.dir = state.sort===key ? -state.dir : -1; state.sort=key; render(); };
    head.append(th);
  });
  const tbody = el('tbody');
  rows.slice(0, 500).forEach(i => {
    const cb = el('input',{type:'checkbox', checked:state.sel.has(i.id), disabled:!i.deletable});
    cb.onchange = () => { cb.checked ? state.sel.add(i.id) : state.sel.delete(i.id); renderFooter(); };
    const info = el('td',{}, el('div',{textContent:i.name}), el('div',{className:'path',textContent:i.path}),
      el('div',{className:'reason',textContent:i.reason}));
    if (i.kind==='app' && i.uninstall_cmd) info.append(el('div',{className:'path',textContent:'Uninstall: '+i.uninstall_cmd}));
    if (i.ai_verdict) info.append(el('div',{className:'ai',textContent:'AI: '+i.ai_verdict+(i.ai_reason?' - '+i.ai_reason:'')}));
    tbody.append(el('tr',{},
      el('td',{}, i.deletable ? cb : el('span',{className:'hint',textContent:i.kind==='app'?'uninstall':'locked'})),
      info,
      el('td',{className:'num',textContent:fmt(i.size_bytes)}),
      el('td',{className:'num',title:i.last_used_source,textContent:ago(i.last_used)}),
      el('td',{className:'num',textContent:Math.round(i.confidence*100)+'%'}),
      el('td',{}, el('span',{className:'pill '+i.risk,textContent:i.risk}))));
  });
  main.append(el('table',{}, el('thead',{},head), tbody));
  if (rows.length>500) main.append(el('div',{className:'hint',textContent:'Showing the 500 largest of '+rows.length+'. Use filters to narrow down.'}));
}

function renderUsage(main) {
  let node = DATA.usage_tree;
  const trail = [node];
  state.usagePath.forEach(name => { const c = node.children.find(x=>x.name===name); if (c) { node=c; trail.push(c); } });
  const crumbs = el('div',{className:'crumbs'});
  trail.forEach((t,idx) => {
    const a = el('a',{textContent:t.name}); a.onclick = () => { state.usagePath = state.usagePath.slice(0,idx); render(); };
    crumbs.append(a, idx<trail.length-1 ? ' / ' : ' ('+fmt(t.size)+')');
  });
  main.append(crumbs);
  const max = Math.max(1, ...node.children.map(c=>c.size));
  node.children.forEach(c => {
    const drill = c.children && c.children.length;
    const row = el('div',{className:'bar-row'+(drill?' click':''), title:c.path},
      el('div',{textContent:c.name}),
      el('div',{}, el('div',{className:'bar', style:'width:'+(c.size/max*100)+'%'})),
      el('div',{className:'num',style:'text-align:right',textContent:fmt(c.size)}));
    if (drill) row.onclick = () => { state.usagePath.push(c.name); render(); };
    main.append(row);
  });
  if (!node.children.length) main.append(el('div',{className:'empty',textContent:'No deeper levels recorded (the scan keeps 3 levels).'}));
}

function renderFooter() {
  const chosen = items.filter(i=>state.sel.has(i.id));
  document.getElementById('selcount').textContent = chosen.length;
  document.getElementById('seltotal').textContent = fmt(chosen.reduce((s,i)=>s+i.size_bytes,0));
  document.getElementById('export').disabled = !chosen.length;
}

function render() {
  renderTabs();
  const usage = state.tab==='usage';
  document.getElementById('tools').style.display = usage ? 'none' : 'flex';
  const main = document.getElementById('main'); main.replaceChildren();
  usage ? renderUsage(main) : renderTable(main);
  renderFooter();
}

document.getElementById('scanned').textContent = 'Scanned ' + new Date(DATA.scanned_at*1000).toLocaleString() +
  (DATA.errors.length ? ' - ' + DATA.errors.length + ' folders could not be read' : '');
document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };
document.getElementById('conf').onchange = e => { state.conf = +e.target.value; render(); };
document.getElementById('clearsel').onclick = () => { state.sel.clear(); render(); };
document.getElementById('selhigh').onclick = () => {
  items.filter(i=>i.deletable && i.confidence>=0.7 && i.risk==='low').forEach(i=>state.sel.add(i.id)); render();
};
document.getElementById('export').onclick = () => {
  const chosen = items.filter(i=>state.sel.has(i.id)).map(i=>({path:i.path, name:i.name, kind:i.kind, size_bytes:i.size_bytes}));
  const blob = new Blob([JSON.stringify({exported_at:Date.now()/1000, items:chosen}, null, 2)], {type:'application/json'});
  const a = el('a',{href:URL.createObjectURL(blob), download:'selection.json'}); a.click();
  document.getElementById('hint').textContent = 'Saved selection.json (check Downloads). Move it into the output folder, then run: python -m declutter clean --selection <path>';
};
renderCards(); render();
</script>
</body>
</html>
